<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirigiendo…</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:#111;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px;box-sizing:border-box}
  .l{width:42px;height:42px;border:4px solid #333;border-top-color:#f5c400;border-radius:50%;animation:g 1s linear infinite;margin-bottom:16px}
  @keyframes g{to{transform:rotate(360deg)}}
  small{opacity:.6;margin-top:30px}
</style>
</head>
<body>
<div class="l" id="l"></div>
<div id="t">Abriendo…</div>
<small>QR dinámico por Grow Agencia Creativa</small>
<script src="config.js"></script>
<script>
(async function(){
  const t = document.getElementById('t'), l = document.getElementById('l');
  const slug = new URLSearchParams(location.search).get('c');
  const fail = s => { l.remove(); t.innerHTML = s; };
  if (!slug) return fail('QR no válido');
  let r = null, err = null;
  for (let i = 0; i < 2 && !r; i++){            // 2 intentos
    try{ r = await slApi({ action:'qr', s:slug }); }catch(e){ err = e; }
  }
  if (!r) return fail('No se pudo abrir el QR.<br><small>' + (err ? err.message : '') + '</small><br><br><button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:10px;font-weight:700">Reintentar</button>');
  if (!r.ok) return fail('Este QR no existe');
  if (r.inactivo) return fail('Este QR no está activo en este momento');
  let d = String(r.destino||'').trim();
  if (!/^(https?:|mailto:|tel:)/i.test(d)) d = 'https://' + d;
  t.textContent = 'Abriendo…';
  location.replace(d);
})();
</script>
</body>
</html>
