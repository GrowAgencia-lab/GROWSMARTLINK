<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Link · Grow Agencia Creativa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="card.css">
<script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{--bg:#f4f4f6;--card:#fff;--ink:#141416;--mut:#6b6b75;--line:#e4e4ea;--acc:#f5c400;--dark:#141416;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px}
  .sl-card{min-height:100%}
  button,input,select,textarea{font-family:inherit;font-size:15px}
  header{background:var(--dark);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  header b{font-weight:900;font-size:18px}
  header .tag{background:var(--acc);color:#111;font-weight:900;font-size:11px;padding:3px 8px;border-radius:20px}
  header .sp{flex:1}
  header button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
  .tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
  .tab{border:none;background:#e7e7ec;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:800;color:var(--mut);cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--card);color:var(--ink)}
  main{background:var(--card);margin:0 16px 30px;border-radius:0 16px 16px 16px;padding:18px;min-height:60vh}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn.p{background:var(--acc);color:#111}
  .btn.d{background:var(--dark);color:#fff}
  .btn.g{background:#ececf1;color:var(--ink)}
  .btn.r{background:#fde8e8;color:var(--bad)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
  label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:0 0 5px;text-transform:uppercase;letter-spacing:.4px}
  .f{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .item{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .item .av{width:48px;height:48px;border-radius:12px;background:#111;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0}
  .item .av img{width:100%;height:100%;object-fit:cover}
  .item .info{flex:1;min-width:170px}
  .item .info b{display:block;font-size:16px}
  .item .info small{color:var(--mut)}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
  .b-ok{background:#dcfce7;color:var(--ok)} .b-warn{background:#fef3c7;color:var(--warn)} .b-bad{background:#fee2e2;color:var(--bad)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
  .stat{background:var(--bg);border-radius:14px;padding:12px}
  .stat b{font-size:24px;font-weight:900;display:block}
  .stat small{color:var(--mut);font-weight:700}
  /* Editor */
  .ed{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
  .sec{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .sec h3{margin:0 0 12px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
  .ed .pv{position:sticky;top:70px}
  .phone{position:relative;width:360px;height:740px;border:10px solid #111;border-radius:44px;overflow:hidden;background:#111;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .phone .scr{width:100%;height:100%;overflow-y:auto;display:flex}
  .phone .scr .sl-card{min-height:100%}
  .imgf{display:flex;gap:8px;align-items:center}
  .imgf img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#eee;flex-shrink:0}
  .bt{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bt .full{grid-column:1/-1}
  .bt .ctrl{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
  .pal{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pal span{width:34px;height:34px;border-radius:10px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
  input[type=color]{padding:3px;height:44px}
  input[type=range]{accent-color:#141416}
  .galed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
  .gi{border:1.5px solid var(--line);border-radius:12px;padding:6px;text-align:center}
  .gi img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
  .gi div{display:flex;gap:4px;justify-content:center}
  .gi .btn.sm{padding:5px 8px}
  .mobprev{display:none}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:20px}
  .modal.on{display:flex}
  .mbox{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:460px;margin:auto}
  .mbox h3{margin:0 0 14px;font-weight:900}
  #qrBox{display:flex;justify-content:center;background:var(--bg);border-radius:16px;padding:16px;margin-bottom:12px}
  #qrBox canvas,#qrBox svg{max-width:100%;height:auto!important}
  .url{background:var(--bg);border-radius:10px;padding:10px;font-size:13px;word-break:break-all;margin-bottom:12px;font-weight:700}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99;display:none}
  .warn{background:#fef3c7;color:#92400e;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:700;font-size:14px}
  .help{background:var(--bg);border-radius:14px;padding:14px;font-size:14px;line-height:1.5;color:#333}
  #login{max-width:360px;margin:12vh auto;background:#fff;border-radius:20px;padding:26px;text-align:center}
  #login h2{margin:0 0 6px;font-weight:900}
  @media(max-width:900px){
    .ed{grid-template-columns:1fr}
    .ed .pv{display:none}
    .ed.showpv .pv{display:block;position:fixed;top:0;inset:0;background:rgba(0,0,0,.8);z-index:40;padding:16px;overflow:auto}
    .ed.showpv .phone{position:relative;top:0;width:100%;max-width:380px;height:85vh}
    .mobprev{display:inline-flex}
    main{margin:0 8px 30px;padding:14px}
    .tabs{padding:10px 8px 0}
  }
</style>
</head>
<body>

<div id="login">
  <h2>Smart Link</h2>
  <p style="color:#6b6b75;margin-top:0">Panel de Grow Agencia Creativa</p>
  <div class="f"><input id="lk" type="password" placeholder="Clave de acceso"></div>
  <button class="btn p" style="width:100%;justify-content:center" onclick="login()">Entrar</button>
  <p id="lerr" style="color:#dc2626;font-weight:700"></p>
</div>

<div id="appw" style="display:none">
  <header>
    <b>Smart Link</b><span class="tag">GROW</span><span class="sp"></span>
    <button title="Actualizar" onclick="load()"><i class="fa-solid fa-rotate"></i></button>
    <button title="Salir" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </header>
  <div class="tabs">
    <button class="tab on" data-t="cards" onclick="tab('cards')"><i class="fa-solid fa-id-card"></i> Tarjetas</button>
    <button class="tab" data-t="qrs" onclick="tab('qrs')"><i class="fa-solid fa-qrcode"></i> QR dinámicos</button>
    <button class="tab" data-t="read" onclick="tab('read')"><i class="fa-solid fa-magnifying-glass"></i> Leer QR viejo</button>
  </div>
  <main id="main"></main>
</div>

<!-- Modal QR / Enviar -->
<div class="modal" id="mq" onclick="if(event.target===this)closeM('mq')">
  <div class="mbox">
    <h3 id="mqT">Código QR</h3>
    <div id="qrBox"></div>
    <div class="url" id="mqU"></div>
    <div class="grid2 f">
      <div><label>Color QR</label><input type="color" id="qc1" value="#141416" oninput="drawQR()"></div>
      <div><label>Fondo</label><input type="color" id="qc2" value="#ffffff" oninput="drawQR()"></div>
    </div>
    <div class="grid2 f">
      <div><label>Estilo</label>
        <select id="qst" onchange="drawQR()">
          <option value="rounded">Redondeado</option><option value="dots">Puntos</option>
          <option value="square">Cuadrado</option><option value="extra-rounded">Muy redondeado</option>
        </select></div>
      <div><label>Logo al centro</label>
        <select id="qlg" onchange="drawQR()"><option value="1">Sí</option><option value="0">No</option></select></div>
    </div>
    <div class="row f">
      <button class="btn d sm" onclick="dlQR('png')"><i class="fa-solid fa-download"></i> PNG</button>
      <button class="btn g sm" onclick="dlQR('svg')"><i class="fa-solid fa-download"></i> SVG (imprenta)</button>
      <button class="btn g sm" onclick="copy(qrState.url)"><i class="fa-regular fa-copy"></i> Copiar link</button>
      <a class="btn g sm" id="mqO" target="_blank"><i class="fa-solid fa-up-right-from-square"></i> Abrir</a>
    </div>
    <div class="sec">
      <h3><i class="fa-solid fa-wifi" style="transform:rotate(90deg)"></i> Grabar en tarjeta / sticker NFC</h3>
      <p style="font-size:13px;color:#6b6b75;margin:0 0 10px">Al acercar el celular a la tarjeta NFC, se abre este link.</p>
      <button class="btn d" style="width:100%;justify-content:center" onclick="writeNFC()"><i class="fa-solid fa-mobile-screen-button"></i> Grabar NFC ahora</button>
      <div id="nfcMsg" style="font-size:13px;margin-top:10px;line-height:1.5"></div>
    </div>
    <div class="sec" style="margin:0">
      <h3><i class="fa-brands fa-whatsapp" style="color:#25D366"></i> Enviar al cliente</h3>
      <div class="f"><label>WhatsApp del cliente</label><input id="mqN" placeholder="0981 123 456"></div>
      <div class="f"><label>Mensaje</label><textarea id="mqM" rows="5"></textarea></div>
      <button class="btn p" style="width:100%;justify-content:center" onclick="sendWA()"><i class="fa-brands fa-whatsapp"></i> Enviar por WhatsApp</button>
      <p style="font-size:12px;color:#6b6b75;margin:8px 0 0">Tip: descargá primero el PNG del QR y adjuntalo en el mismo chat.</p>
    </div>
    <button class="btn g" style="width:100%;justify-content:center;margin-top:12px" onclick="closeM('mq')">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="card.js"></script>
<script>
slLoadFont('Nunito');
/* ================= ESTADO ================= */
let KEY = '';
let DB = { cards: [], qrs: [] };
let TAB = 'cards';
let ED = null;          // tarjeta en edición
let ED_OLD = '';        // slug original (si se edita)
let QED = null, QED_OLD = '';
let qr = null, qrState = {};

const PALETAS = [
  ['#f5c400','#e0e0e0','#1c1c1e'], ['#22d3ee','#a78bfa','#0f172a'], ['#f43f5e','#fda4af','#18181b'],
  ['#10b981','#a7f3d0','#052e2b'], ['#c9a227','#f3e9c6','#111111'], ['#2563eb','#93c5fd','#ffffff'],
  ['#ec4899','#fbcfe8','#ffffff'], ['#f97316','#fed7aa','#1f1300']
];

/* ================= API ================= */
const demo = () => !CONFIG.API_URL || /PEGAR/.test(CONFIG.API_URL);
async function apiGet(p){ return slApi(Object.assign({key:KEY}, p)); }
async function apiPost(o){
  const r = await fetch(CONFIG.API_URL, {method:'POST', credentials:'omit', body: JSON.stringify(Object.assign({key:KEY}, o))});
  return r.json();
}

/* ================= LOGIN ================= */
async function login(){
  const k = document.getElementById('lk').value.trim();
  const e = document.getElementById('lerr');
  if (demo()) { e.textContent = 'Falta pegar la URL del Apps Script en config.js'; return; }
  e.textContent = 'Verificando…';
  try{
    KEY = k; const r = await apiGet({action:'ping'});
    if (!r.ok) { e.textContent = r.error || 'Clave incorrecta'; return; }
    try{ localStorage.setItem('sl_admin', k); }catch(x){}
    start();
  }catch(x){ e.textContent = 'No se pudo conectar con el servidor'; }
}
function logout(){ try{localStorage.removeItem('sl_admin')}catch(x){} location.reload(); }
function start(){
  document.getElementById('login').style.display='none';
  document.getElementById('appw').style.display='block';
  load();
}
// Arranque: espera a que todo el código esté cargado (antes fallaba al entrar con la clave guardada)
window.addEventListener('DOMContentLoaded', function(){ let k=''; try{ k = localStorage.getItem('sl_admin')||''; }catch(x){}
  if (k){ KEY = k; start(); }
  document.getElementById('lk').addEventListener('keydown', e => { if (e.key==='Enter') login(); });
});

async function load(){
  main('<p style="color:#6b6b75">Cargando…</p>');
  try{
    const r = await apiGet({action:'list'});
    if (!r.ok){ if (/Clave/.test(r.error)) return logout(); return main('<p>'+slEsc(r.error)+'</p>'); }
    DB = r; tab(TAB);
  }catch(e){ main('<p>No se pudo cargar. Revisá tu conexión.</p>'); }
}

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
function main(h){ $('main').innerHTML = h; }
function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2600); }
function copy(t){ navigator.clipboard.writeText(t).then(()=>toast('Copiado ✓')).catch(()=>prompt('Copiá el link:', t)); }
function closeM(id){ $(id).classList.remove('on'); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function enUnAnio(){ const d=new Date(); d.setFullYear(d.getFullYear()+1); return d.toISOString().slice(0,10); }
function diasA(f){ if(!f) return 9999; return Math.ceil((new Date(f+'T12:00:00') - new Date())/864e5); }
function slugify(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function estadoBadge(o){
  if (o.estado!=='activo') return '<span class="badge b-bad">Pausada</span>';
  const d = diasA(o.vence);
  if (d < 0) return '<span class="badge b-bad">Vencida</span>';
  if (d <= 30) return `<span class="badge b-warn">Vence en ${d} d</span>`;
  return '<span class="badge b-ok">Activa</span>';
}
const cardUrl = s => CONFIG.BASE_URL + '?c=' + s;
const qrUrl   = s => CONFIG.BASE_URL + 'q.html?c=' + s;

function tab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t===t));
  if (t==='cards') viewCards(); else if (t==='qrs') viewQrs(); else viewRead();
}

/* ================= TARJETAS: LISTA ================= */
function viewCards(filter){
  filter = (filter||'').toLowerCase();
  const all = DB.cards || [];
  const act = all.filter(c => c.estado==='activo' && diasA(c.vence)>=0).length;
  const porV = all.filter(c => c.estado==='activo' && diasA(c.vence)>=0 && diasA(c.vence)<=30).length;
  const vis = all.reduce((a,c)=>a+(+c.visitas||0),0);
  const list = all.filter(c => !filter || [c.cliente,c.nombre,c.empresa,c.slug].join(' ').toLowerCase().includes(filter))
                  .sort((a,b)=> String(b.actualizado).localeCompare(String(a.actualizado)));
  let h = `<div class="stats">
    <div class="stat"><b>${all.length}</b><small>Tarjetas</small></div>
    <div class="stat"><b>${act}</b><small>Activas</small></div>
    <div class="stat"><b style="color:var(--warn)">${porV}</b><small>Por vencer (30 d)</small></div>
    <div class="stat"><b>${vis}</b><small>Visitas totales</small></div></div>
  <div class="row" style="margin-top:12px">
    <button class="btn p" onclick="editCard()"><i class="fa-solid fa-plus"></i> Nueva tarjeta</button>
    <input style="flex:1;min-width:180px" placeholder="Buscar cliente…" value="${slEsc(filter)}" oninput="viewCards(this.value);this.focus();this.setSelectionRange(this.value.length,this.value.length)">
  </div><div class="list">`;
  if (!list.length) h += '<p style="color:#6b6b75">Todavía no hay tarjetas. Creá la primera 👆</p>';
  list.forEach(c => {
    const im = c.foto || c.logo;
    h += `<div class="item">
      <div class="av">${im?`<img src="${slEsc(im)}">`:slEsc((c.nombre||'?')[0])}</div>
      <div class="info"><b>${slEsc(c.nombre||'(sin nombre)')} ${estadoBadge(c)}</b>
        <small>${slEsc(c.cliente||c.empresa||'')} · /${slEsc(c.slug)} · vence ${slEsc(c.vence||'—')}</small><br>
        <small><i class="fa-regular fa-eye"></i> ${+c.visitas||0} visitas · <i class="fa-solid fa-hand-pointer"></i> ${+c.clics||0} clics</small></div>
      <div class="acts">
        <button class="btn d sm" onclick="editCard('${c.slug}')"><i class="fa-solid fa-pen"></i> Editar</button>
        <button class="btn p sm" onclick="openQR('card','${c.slug}')"><i class="fa-solid fa-qrcode"></i> QR / Enviar</button>
        <a class="btn g sm" href="${cardUrl(c.slug)}" target="_blank"><i class="fa-solid fa-eye"></i></a>
        <button class="btn g sm" title="Duplicar" onclick="editCard('${c.slug}',true)"><i class="fa-regular fa-clone"></i></button>
      </div></div>`;
  });
  main(h + '</div>');
}

/* ================= TARJETAS: EDITOR ================= */
function editCard(slug, dup){
  const src = slug ? (DB.cards||[]).find(c => c.slug===slug) : null;
  ED = src ? JSON.parse(JSON.stringify(src)) : {
    estado:'activo', vence:enUnAnio(), tema:'oscuro', color1:'#f5c400', color2:'#e0e0e0', color3:'#1c1c1e',
    mensajeWA:'Hola, vi tu tarjeta digital y quisiera más información.', botones:[]
  };
  if (!Array.isArray(ED.botones)) ED.botones = [];
  ED.extra = slX(ED);
  ED_OLD = (src && !dup) ? src.slug : '';
  if (dup){ ED.slug=''; ED.nombre=''; ED.cargo=''; ED.foto=''; ED.telefono=''; ED.whatsapp=''; ED.email=''; ED.visitas=0; ED.extra.galeria=[]; }
  renderEditor();
}

function fld(k, lab, ph, type){
  return `<div class="f"><label>${lab}</label><input ${type?`type="${type}"`:''} data-k="${k}" value="${slEsc(ED[k]||'')}" placeholder="${ph||''}" oninput="setF(this)"></div>`;
}
function imgFld(k, lab){
  return `<div class="f"><label>${lab}</label><div class="imgf">
    <img id="im_${k}" src="${slEsc(ED[k]||'')}" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
    <input data-k="${k}" value="${slEsc(ED[k]||'')}" placeholder="URL o subí una imagen" oninput="setF(this);$('im_${k}').src=this.value">
    <label class="btn g sm" style="margin:0;text-transform:none;letter-spacing:0;color:var(--ink)"><i class="fa-solid fa-upload"></i>
      <input type="file" accept="image/*" style="display:none" onchange="upImg(this,'${k}')"></label>
  </div></div>`;
}

function renderEditor(){
  let h = `<div class="row" style="margin-bottom:14px">
      <button class="btn g" onclick="viewCards()"><i class="fa-solid fa-arrow-left"></i> Volver</button>
      <span style="flex:1"></span>
      <button class="btn g mobprev" onclick="document.querySelector('.ed').classList.add('showpv')"><i class="fa-solid fa-mobile-screen"></i> Vista previa</button>
      <button class="btn p" onclick="saveCard()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
    </div>
    <div class="ed"><div>
    <div class="sec"><h3><i class="fa-solid fa-briefcase"></i> Servicio</h3>
      ${fld('cliente','Cliente (quién paga)','Ej: Remeg S.A.')}
      <div class="f"><label>Link de la tarjeta</label>
        <input data-k="slug" value="${slEsc(ED.slug||'')}" placeholder="guillermo-gimenez" oninput="this.value=slugify(this.value);setF(this);$('slp').textContent=cardUrl(this.value)">
        <small id="slp" style="color:#6b6b75;word-break:break-all">${cardUrl(ED.slug||'')}</small></div>
      <div class="grid2">
        <div class="f"><label>Estado</label><select data-k="estado" onchange="setF(this)">
          <option value="activo" ${ED.estado==='activo'?'selected':''}>Activa</option>
          <option value="pausado" ${ED.estado!=='activo'?'selected':''}>Pausada</option></select></div>
        ${fld('vence','Vence (renovación)','', 'date')}
      </div>
    </div>
    <div class="sec"><h3><i class="fa-solid fa-user"></i> Datos de contacto</h3>
      ${fld('nombre','Nombre','Lic. Guillermo Giménez')}
      <div class="grid2">${fld('cargo','Cargo','Gerente Comercial')}${fld('empresa','Empresa','Empresa S.A.')}</div>

function X(){ if (!ED.extra || typeof ED.extra!=='object') ED.extra = slX(ED); return ED.extra; }
function setX(el){
  const k = el.dataset.x; let v = el.value;
  if (el.type==='range' || k==='galeriaCols') v = +v;
  X()[k] = v;
  const o = document.getElementById('xv_'+k); if (o) o.textContent = v + (o.dataset.u||'');
  preview();
}
function xRange(k, lab, min, max, u){
  const v = X()[k];
  return `<div class="f"><label>${lab}: <span id="xv_${k}" data-u="${u}">${v}${u}</span></label>
    <input type="range" min="${min}" max="${max}" value="${v}" data-x="${k}" oninput="setX(this)" style="padding:0;border:none"></div>`;
}
function fontOpts(sel){
  const prop = (X().fuentesPropias||[]).map(p => p.nombre);
  let h = prop.length ? '<optgroup label="Agregadas">' + prop.map(f => `<option value="${slEsc(f)}" ${f===sel?'selected':''}>${slEsc(f)}</option>`).join('') + '</optgroup>' : '';
  return h + '<optgroup label="Lista">' + Object.keys(SL_FUENTES).map(f => `<option value="${f}" ${f===sel?'selected':''}>${f}</option>`).join('') + '</optgroup>';
}
function refreshFonts(){
  ['fuenteTitulo','fuenteTexto'].forEach(k => { const el = document.querySelector(`[data-x="${k}"]`); if (el) el.innerHTML = fontOpts(X()[k]); });
  const fp = X().fuentesPropias||[];
  $('fpL').innerHTML = fp.map((p,i) => `<span class="badge b-ok" style="margin:0 6px 6px 0;font-size:12px">${slEsc(p.nombre)}${p.url?' 📁':''}
    <a href="#" onclick="rmFont(${i});return false" style="color:#dc2626;text-decoration:none;margin-left:4px">✕</a></span>`).join('');
}
function addFont(){
  const n = $('fpN').value.trim().replace(/['"]/g,''), u = $('fpU').value.trim();
  if (!n) return toast('Escribí el nombre de la fuente');
  const x = X(); x.fuentesPropias = (x.fuentesPropias||[]).filter(p => p.nombre !== n);
  x.fuentesPropias.push({nombre:n, url:u});
  x.fuenteTitulo = n;            // se aplica al nombre; cambiala en los selectores si querés
  $('fpN').value = ''; $('fpU').value = '';
  refreshFonts(); preview(); toast('Tipografía agregada ✓');
}
function rmFont(i){
  const x = X(), f = x.fuentesPropias[i]; x.fuentesPropias.splice(i,1);
  if (x.fuenteTitulo === f.nombre) x.fuenteTitulo = 'Nunito';
  if (x.fuenteTexto === f.nombre) x.fuenteTexto = 'Nunito';
  refreshFonts(); preview();
}
async function upFont(inp){
  const f = inp.files[0]; if (!f) return;
  if (f.size > 3e6) return toast('El archivo es muy pesado (máx. 3 MB)');
  toast('Subiendo fuente…');
  try{
    const base64 = await new Promise((ok,ko) => { const r=new FileReader(); r.onload=()=>ok(r.result.split(',')[1]); r.onerror=ko; r.readAsDataURL(f); });
    const r = await apiPost({action:'uploadFont', base64, name:f.name});
    if (!r.ok) return toast(r.error||'Error al subir');
    $('fpU').value = r.url;
    if (!$('fpN').value) $('fpN').value = f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');
    toast('Archivo listo ✓ Ahora tocá "Agregar y usar"');
  }catch(e){ toast('No se pudo subir la fuente'); }
  inp.value='';
}

/* ---- Imágenes ---- */
function fileToB64(file, max){
  return new Promise((ok,ko) => {
    const png = /png|svg|webp/.test(file.type);
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.src = rd.result; };
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const mime = png ? 'image/png' : 'image/jpeg';
      ok({ mime, base64: cv.toDataURL(mime, .86).split(',')[1] });
    };
    img.onerror = ko; rd.onerror = ko; rd.readAsDataURL(file);
  });
}
async function upImg(inp, k){
  const f = inp.files[0]; if (!f) return;
  toast('Subiendo imagen…');
  try{
    const {mime, base64} = await fileToB64(f, k==='fondo'?1200:700);
    const r = await apiPost({action:'upload', mime, base64, name:(ED.slug||'tarjeta')+'_'+k+'_'+Date.now()});
    if (!r.ok) return toast(r.error||'Error al subir');
    ED[k] = r.url;
    const i = document.querySelector(`input[data-k="${k}"]`); if (i) i.value = r.url;
    $('im_'+k).src = r.url;
    if (k==='fondo'){ X().fondoModo='imagen'; const sel=document.querySelector('[data-x="fondoModo"]'); if(sel) sel.value='imagen'; }
    preview(); toast('Imagen lista ✓');
  }catch(e){ toast('No se pudo subir la imagen'); }
}

  if (!confirm('¿Eliminar este QR? Los impresos dejarán de funcionar.')) return;
  const r = await apiPost({action:'deleteQr', slug:QED_OLD});
  if (!r.ok) return toast(r.error||'Error'); toast('Eliminado'); load();
}

/* ================= LEER QR VIEJO ================= */
function viewRead(){
  main(`<div class="help" style="margin-bottom:14px">
    Subí una foto o captura de un QR que tengas en otra plataforma. Te muestro a qué link apunta.<br><br>
    <b>Importante:</b> si el link es de la plataforma (ej. <i>qrco.de</i>, <i>qr-code-generator</i>, <i>bit.ly</i>…), ese QR depende de ellos.
    Mientras tengas acceso, cambiá su destino a tu nuevo QR de Grow, y reimprimí con el QR nuevo apenas puedas.</div>
    <label class="btn p" style="text-transform:none;letter-spacing:0;color:#111"><i class="fa-solid fa-image"></i> Elegir imagen del QR
      <input type="file" accept="image/*" style="display:none" onchange="readQR(this)"></label>
    <div id="rr" style="margin-top:16px"></div>`);
}
function readQR(inp){
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      let found = null;
      for (const size of [1200, 800, 500]) {
        const s = Math.min(1, size/Math.max(img.width,img.height));
        const cv = document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
        const cx = cv.getContext('2d'); cx.drawImage(img,0,0,cv.width,cv.height);
        const data = cx.getImageData(0,0,cv.width,cv.height);
        const r = jsQR(data.data, cv.width, cv.height, {inversionAttempts:'attemptBoth'});
        if (r) { found = r.data; break; }
      }
      if (!found) return $('rr').innerHTML = '<div class="warn">No pude leer el QR. Probá con una imagen más nítida y de frente.</div>';
      const isUrl = /^https?:/i.test(found);
      window._found = found; window._foundUrl = isUrl ? found : '';
      $('rr').innerHTML = `<label>Este QR contiene</label><div class="url">${slEsc(found)}</div>
        <div class="row">${isUrl?`<a class="btn g" href="${slEsc(found)}" target="_blank"><i class="fa-solid fa-up-right-from-square"></i> Abrir y ver destino final</a>`:''}
        <button class="btn d" onclick="copy(_found)"><i class="fa-regular fa-copy"></i> Copiar</button>
        <button class="btn p" onclick="TAB='qrs';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='qrs'));editQr('',_foundUrl)"><i class="fa-solid fa-qrcode"></i> Crear QR propio</button></div>
        <p style="font-size:13px;color:#6b6b75">Al crear el QR propio, poné como destino la página <b>final</b> (la que se abre al final), no el link de la otra plataforma.</p>`;
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}

/* ================= MODAL QR ================= */
function openQR(kind, slug){
  let url, title, logo='', c1='#141416', name='', msg='';
  if (kind==='card'){
    const c = (DB.cards||[]).find(x=>x.slug===slug) || {slug};
    url = cardUrl(slug); title = 'Tarjeta de ' + (c.nombre||slug); logo = c.logo || '';
    c1 = (c.tema==='claro' || !c.color3 || c.color3==='#ffffff') ? '#141416' : c.color3;
    name = (c.nombre||'').split(' ').filter(w=>!/\./.test(w))[0] || '';
    msg = `¡Hola${name?' '+name:''}! 👋\n\nTu tarjeta digital ya está lista ✨\n${url}\n\nGuardala en tus favoritos y compartila con tus clientes. También te envío el código QR para tus materiales impresos.\n\n— ${CONFIG.MARCA}`;
    $('mqN').value = c.whatsapp || c.telefono || '';
  } else {
    const q = (DB.qrs||[]).find(x=>x.slug===slug) || {slug};
    url = qrUrl(slug); title = 'QR: ' + (q.nombre||slug);
    msg = `¡Hola! 👋\n\nTe envío tu código QR dinámico:\n${url}\n\nSi necesitás cambiar a dónde lleva, avisanos y lo actualizamos sin reimprimir.\n\n— ${CONFIG.MARCA}`;
    $('mqN').value = '';
  }
  qrState = { url, logo, slug };
  $('mqT').textContent = title; $('mqU').textContent = url; $('mqO').href = url; $('mqM').value = msg;
  $('qc1').value = c1; $('qlg').value = logo ? '1' : '0';
  $('nfcMsg').innerHTML = '';
  $('mq').classList.add('on'); drawQR();
}
function qrOpts(size){
  const useLogo = $('qlg').value==='1' && qrState.logo;
  return {
    width:size, height:size, type:'canvas', data:qrState.url, margin:16,
    image: useLogo ? qrState.logo : undefined,
    qrOptions:{ errorCorrectionLevel: useLogo ? 'H' : 'Q' },
    dotsOptions:{ color:$('qc1').value, type:$('qst').value },
    cornersSquareOptions:{ color:$('qc1').value, type: $('qst').value==='square' ? 'square' : 'extra-rounded' },
    cornersDotOptions:{ color:$('qc1').value },
    backgroundOptions:{ color:$('qc2').value },
    imageOptions:{ crossOrigin:'anonymous', margin:6, imageSize:.32, hideBackgroundDots:true }
  };
}
function drawQR(){
  $('qrBox').innerHTML = '';
  qr = new QRCodeStyling(qrOpts(280));
  qr.append($('qrBox'));
}
function dlQR(ext){
  const big = new QRCodeStyling(Object.assign(qrOpts(1200), {type: ext==='svg'?'svg':'canvas'}));
  big.download({ name:'QR-' + qrState.slug, extension: ext })
     .catch(()=>toast('No se pudo descargar con logo. Probá "Logo al centro: No".'));
}
async function writeNFC(){
  const m = $('nfcMsg');
  if (!('NDEFReader' in window)){
    m.innerHTML = `<div class="warn" style="margin:0">Este navegador no puede grabar NFC directo (solo funciona en <b>Chrome de Android</b>, abriendo este panel desde el celular).<br><br>
      <b>Opción con app:</b> instalá <b>NFC Tools</b> (Android o iPhone) → <i>Escribir</i> → <i>Agregar un registro</i> → <i>URL/URI</i> → pegá el link → <i>Escribir</i> y acercá la tarjeta.<br><br>
      <button class="btn p sm" onclick="copy(qrState.url)"><i class="fa-regular fa-copy"></i> Copiar link para NFC Tools</button></div>`;
    return;
  }
  try{
    m.innerHTML = '<b>Acercá la tarjeta NFC a la parte de atrás del celular…</b>';
    const nd = new NDEFReader();
    await nd.write({ records: [{ recordType:'url', data: qrState.url }] });
    m.innerHTML = '<b style="color:#16a34a">✓ Tarjeta NFC grabada. Probala acercándola a otro celular.</b>';
  }catch(e){
    m.innerHTML = '<b style="color:#dc2626">No se pudo grabar: ' + slEsc(e.message) + '</b><br>Revisá que el NFC del celular esté activado.';
  }
}
function sendWA(){
  const n = slNum($('mqN').value);
  const t = encodeURIComponent($('mqM').value);
  window.open(n ? `https://wa.me/${n}?text=${t}` : `https://wa.me/?text=${t}`, '_blank');
}
</script>
